# Netlify build settings for the Sascan website.
# The site is a static export: `npm run build` writes the finished site into ./out
# (and runs scripts/flatten-rsc.mjs so page-to-page navigation works on static hosting).

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Show the site's own 404 page for unknown addresses
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
